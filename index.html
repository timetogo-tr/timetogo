<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time to Go Panel</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#000;--panel:#0f1117;--panel2:#161a23;--cizgi:#2a2e39;--yazi:#d1d4dc;--soluk:#8a90a0;--yesil:#26a69a;--kirmizi:#ef5350;--mavi:#2962ff;--sari:#facc15}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font:13px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
#ust{display:flex;align-items:center;gap:4px;height:44px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--cizgi);flex:none;overflow-x:auto;scrollbar-width:none}
#ust::-webkit-scrollbar{display:none}
.logo{font-weight:800;color:var(--sari);letter-spacing:.5px;margin-right:8px;white-space:nowrap}
.ayrac{width:1px;height:22px;background:var(--cizgi);margin:0 4px;flex:none}
.ub{padding:5px 8px;border-radius:4px;white-space:nowrap;color:var(--yazi)}
.ub:hover{background:var(--panel2)}
.ub.secili{color:var(--mavi);font-weight:600}
#ytKutu{position:fixed;left:12px;bottom:12px;z-index:60;background:#131722;border:1px solid #2a2e39;border-radius:8px;padding:6px;box-shadow:0 6px 24px #0008}
#ytKutu header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#b2b5be;margin-bottom:4px;gap:8px}
#ytKutu header button{background:none;border:0;color:#b2b5be;cursor:pointer;font-size:14px}
#ytKutu iframe{display:block;width:240px;height:135px;border:0;border-radius:4px}
#sembolAd{font-weight:700}
#saat{margin-left:auto;color:var(--soluk);white-space:nowrap;padding-left:8px}
#listeAc{display:none}
#govde{flex:1;display:flex;min-height:0}
#araclar{width:46px;flex:none;background:var(--panel);border-right:1px solid var(--cizgi);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px}
.arac{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;color:var(--yazi)}
.arac:hover{background:var(--panel2)}
.arac.secili{background:#1e2a4a;color:#5b8cff}
.arac svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.arac-ayrac{width:26px;height:1px;background:var(--cizgi);margin:4px 0}
#grafikAlan{flex:1;position:relative;min-width:0}
#grafik{position:absolute;inset:0}
#sinyalOzet{position:absolute;left:10px;bottom:34px;z-index:4;background:rgba(10,12,18,.82);border:1px solid #2a2e39;border-radius:6px;padding:6px 10px;font-size:12px;color:#d1d4dc;pointer-events:none;line-height:1.5}
#sinyalOzet b{color:#f7c948}#sinyalOzet .y{color:#26a69a}#sinyalOzet .k{color:#ef5350}
#cizim{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden;z-index:2}
#cizim.aktif{pointer-events:auto;cursor:crosshair}
#lejant{position:absolute;left:10px;top:8px;z-index:3;pointer-events:none;font-size:13px;white-space:nowrap}
#lejant .baslik{font-weight:600;margin-right:8px}
#lejant .d{margin-right:8px}
#lejant .gl{color:var(--soluk);font-size:12px;margin-top:3px}
#durum{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);color:var(--soluk);z-index:3;pointer-events:none}
#ttgKart{position:absolute;right:76px;top:6px;z-index:4;display:flex;flex-wrap:wrap;align-items:stretch;max-width:calc(100% - 420px);background:rgba(30,34,45,.94);border:1px solid #131722;border-radius:4px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.5)}
#ttgKart .kb{color:var(--sari);font-size:13px;display:flex;align-items:center;padding:4px 10px;font-weight:700;cursor:pointer;user-select:none;white-space:nowrap}
#ttgKart .kb::after{content:" ▾";font-size:10px;color:var(--soluk);margin-left:3px}
#ttgKart.kucuk .kb::after{content:" ▸"}
#ttgKart.kucuk .islem .sat{display:none}
#ttgKart .girildi{display:flex;align-items:center;gap:4px;padding:2px 8px;margin:2px 4px;border-radius:3px;background:#1b5e20;color:#b9f6ca;font-size:12px;font-weight:700;white-space:nowrap;animation:gir 1.6s ease-in-out infinite}
@keyframes gir{50%{background:#2e7d32}}
#ttgKart .islem{cursor:pointer;display:flex;align-items:center;gap:12px;padding:4px 10px 4px 0;border-left:1px solid #131722;white-space:nowrap}
#ttgKart .islem:hover{background:#252a37}
#ttgKart .serit{width:3px;align-self:stretch}
#ttgKart .l .serit{background:var(--yesil)}#ttgKart .s .serit{background:var(--kirmizi)}
#ttgKart .ust{display:flex;gap:6px;align-items:center;font-size:13px}
#ttgKart .ust b{color:#fff;font-weight:600}
#ttgKart .l .yon{color:var(--yesil)}#ttgKart .s .yon{color:var(--kirmizi)}
#ttgKart .sat{display:flex;gap:5px;font-size:12px}
#ttgKart .sat span:first-child{color:var(--soluk)}
#ttgKart .sat .st{color:#ef9a9a}#ttgKart .sat .hd{color:#80cbc4}
#ttgKart .not,#ttgKart .git{display:none}
#ttgKart .ara{color:#fff;font-size:13px;display:flex;align-items:center;padding:4px 10px;border-left:1px solid #131722}
#ttgKart .uyari{color:var(--soluk);font-size:10px;display:flex;align-items:center;padding:4px 8px;border-left:1px solid #131722;white-space:nowrap}
#sesBtn.uyar{color:var(--sari)}
#bildirim{position:absolute;left:50%;top:40px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 24px)}
#bildirim[hidden]{display:none}
#bildirim div{padding:10px 16px;border-radius:6px;color:#fff;font-size:14px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.6);animation:yanip 1s ease-in-out 6}
#bildirim .l{background:#1b5e57}#bildirim .s{background:#8e2b2a}
@keyframes yanip{50%{filter:brightness(1.6)}}
#liste{width:270px;flex:none;background:var(--panel);border-left:1px solid var(--cizgi);display:flex;flex-direction:column;min-height:0}
#liste h3{margin:0;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--cizgi)}
.lb{display:grid;grid-template-columns:1fr 92px 64px;padding:5px 12px;color:var(--soluk);font-size:11px;border-bottom:1px solid var(--cizgi)}
.lb span:not(:first-child),.satir span:not(:first-child){text-align:right}
#satirlar{overflow-y:auto;flex:1}
.satir{display:grid;grid-template-columns:1fr 92px 64px;padding:7px 12px;cursor:pointer;align-items:center}
.satir:hover{background:var(--panel2)}
.satir.secili{background:#1e2a4a}
.satir b{font-weight:600}
.satir.ttgS{animation:yanS 1.4s ease-in-out infinite}.satir.ttgL{animation:yanL 1.4s ease-in-out infinite}
@keyframes yanS{0%,100%{background:rgba(239,83,80,.05)}50%{background:rgba(239,83,80,.42)}}
@keyframes yanL{0%,100%{background:rgba(38,166,154,.05)}50%{background:rgba(38,166,154,.42)}}
.satir.ttgS b{color:#ff8a80}.satir.ttgL b{color:#80cbc4}
#listeAc.ttgS{animation:yanS 1.4s ease-in-out infinite}#listeAc.ttgL{animation:yanL 1.4s ease-in-out infinite}
#ustUyari{margin-left:auto;color:#d1a64a;font-size:11px;white-space:nowrap;padding-left:8px}
#ustUyari+#saat{margin-left:0}
#bildirim .iptal{background:#4a4f5c}
#akis{position:absolute;left:8px;top:46px;z-index:3;width:158px;max-height:calc(100% - 150px);overflow:hidden;background:rgba(13,16,24,.78);border:1px solid #2a2e39;border-radius:6px;font:11px/1.25 ui-monospace,Consolas,monospace;pointer-events:none}
#akis[hidden]{display:none}
#akis .ab{color:#d1d4dc;font:600 10px system-ui;letter-spacing:.08em;padding:5px 8px;border-bottom:1px solid #2a2e39;display:flex;align-items:center;gap:6px}
#akis .nk{width:7px;height:7px;border-radius:50%;background:#ff2bd6;box-shadow:0 0 6px #ff2bd6;animation:yanip 1s infinite}
#akisSat div{display:flex;justify-content:space-between;padding:1px 8px;animation:akGel .18s ease-out}
#akisSat .al{color:#2ee88a}#akisSat .sa{color:#ff4d79}
#akisSat .buyuk.al{background:rgba(46,232,138,.22);font-weight:700;text-shadow:0 0 6px #2ee88a}
#akisSat .buyuk.sa{background:rgba(255,77,121,.22);font-weight:700;text-shadow:0 0 6px #ff4d79}
#denge{padding:6px 8px 7px;border-bottom:1px solid #2a2e39;background:linear-gradient(180deg,rgba(255,43,214,.05),transparent)}
#denge .dy{display:flex;justify-content:space-between;font:700 10px system-ui;letter-spacing:.05em}
#dAl{color:#2ee88a;text-shadow:0 0 6px #2ee88a}#dSat{color:#ff4d79;text-shadow:0 0 6px #ff4d79}
#denge .dc{position:relative;height:9px;margin-top:4px;border-radius:5px;background:#ff4d79;box-shadow:0 0 8px rgba(255,77,121,.6) inset,0 0 10px rgba(255,77,121,.35);overflow:visible}
#dBar{position:absolute;left:0;top:0;bottom:0;width:50%;border-radius:5px 0 0 5px;background:linear-gradient(90deg,#0fae5f,#2ee88a);box-shadow:0 0 10px #2ee88a;transition:width .45s cubic-bezier(.2,.8,.2,1)}
#dIgne{position:absolute;top:-4px;bottom:-4px;width:2px;left:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 14px #ff2bd6;transition:left .45s cubic-bezier(.2,.8,.2,1)}
#dBaski{margin-top:5px;text-align:center;font:700 11px system-ui;letter-spacing:.18em;color:#d1d4dc;transition:color .3s,text-shadow .3s}
#dBaski.al{color:#2ee88a;text-shadow:0 0 10px #2ee88a}#dBaski.sa{color:#ff4d79;text-shadow:0 0 10px #ff4d79}
#akis{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
@keyframes akGel{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.satir .ttg{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sari);margin-left:5px;vertical-align:middle}
.art{color:var(--yesil)}.eks{color:var(--kirmizi)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:grid;place-items:center}
#modal[hidden]{display:none}
.kutu{width:min(520px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 60px));background:#1e222d;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--cizgi)}
.kutu header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:17px;font-weight:600}
.kutu input{margin:0 16px 10px;padding:9px 10px;background:#131722;border:1px solid var(--cizgi);border-radius:4px;color:var(--yazi);font:inherit}
.kutu .gr{color:var(--soluk);font-size:11px;padding:8px 16px 4px;text-transform:uppercase;letter-spacing:.5px}
.kutu .og{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;cursor:pointer}
.kutu .og:hover{background:#2a2e39}
.kutu .og small{display:block;color:var(--soluk);font-size:11px}
.kutu .og .tik{color:var(--mavi);font-weight:700}
.kutu .ic{overflow-y:auto;padding-bottom:10px}
#govde{position:relative}
@media (max-width:760px){
  #ust{flex-wrap:wrap;height:auto;padding:4px 6px;row-gap:2px}
  #araliklar{order:10;width:100%;overflow-x:auto;scrollbar-width:none}
  #araliklar::-webkit-scrollbar{display:none}
  #araliklar .ub{padding:5px 9px}
  .ayrac,#saat,#ustUyari{display:none}
  #akis{width:118px;top:40px;font-size:10px;max-height:40%}
  .logo{font-size:12px;margin-right:2px}
  #gostergeBtn{margin-left:auto}
  #liste{position:absolute;right:0;top:0;bottom:0;z-index:10;display:none;width:min(270px,85vw);box-shadow:-6px 0 20px rgba(0,0,0,.6)}
  #liste.acik{display:flex}
  #listeAc{display:block}
  #araclar{width:36px}
  .arac{width:30px;height:30px}
  .arac svg{width:19px;height:19px}
  #ttgKart{left:44px;right:auto;top:24px;max-width:calc(100% - 100px)}
  #ttgKart .islem{flex-wrap:wrap;gap:2px 8px;white-space:normal}
  #ttgKart .sat{font-size:11px}
  #lejant{left:6px;top:4px;font-size:11px}
  #lejant .ohlc{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="ust">
    <span class="logo">TIME TO GO</span>
    <button class="ub" id="sembolAd" title="Coin listesi">BTCUSDT.P</button>
    <span class="ayrac"></span>
    <span id="araliklar" style="display:flex;gap:2px"></span>
    <span class="ayrac"></span>
    <button class="ub" id="gostergeBtn">ƒx Göstergeler</button>
    <button class="ub" id="sesBtn">🔕 Sesi aç</button>
    <button class="ub" id="muzikBtn" title="Tarayıcıda üretilen house / tekno döngüsü (telifsiz)">🎵 Müzik</button>
    <button class="ub" id="ytBtn" style="display:none" title="YouTube linki yapıştır, şarkı panelde çalsın">▶ YouTube</button>
    <button class="ub" id="listeAc">☰ Liste</button>
    <span id="ustUyari">Yatırım tavsiyesi değildir · Paylaşımlar tamamen eğitim ve eğlence amaçlıdır</span>
    <span id="saat"></span>
  </div>
  <div id="govde">
    <nav id="araclar"></nav>
    <main id="grafikAlan">
      <div id="grafik"></div>
      <svg id="cizim"></svg>
      <div id="lejant"></div>
      <div id="durum"></div>
      <div id="sinyalOzet" hidden></div>
      <div id="ttgKart" hidden></div>
      <div id="akis" hidden><div class="ab"><span class="nk"></span>CANLI AKIŞ</div><div id="denge"><div class="dy"><span id="dAl">ALIM 50%</span><span id="dSat">SATIM 50%</span></div><div class="dc"><div id="dBar"></div><div id="dIgne"></div></div><div id="dBaski">DENGE</div></div><div id="akisSat"></div></div>
      <div id="bildirim" hidden></div>
    </main>
    <aside id="liste">
      <h3>İzleme listesi</h3>
      <div class="lb"><span>Sembol</span><span>Son</span><span>Değ%</span></div>
      <div id="satirlar"></div>
    </aside>
  </div>
</div>
<div id="modal" hidden>
  <div class="kutu">
    <header><span>Göstergeler</span><button id="modalKapat" style="font-size:20px">✕</button></header>
    <input id="ara" placeholder="Ara" autocomplete="off">
    <div class="ic" id="gostergeListe"></div>
  </div>
</div>
<script>
// Aktif islemler islemler.json dosyasindan okunur (her islemde yalniz o dosya guncellenir), 30 sn'de bir yenilenir.
// alanlar: coin (BTC / 1000PEPE ...), yon (LONG/SHORT), alt, ust, stop, hedef, bitis (ISO saat), not
let ISLEMLER = [];
let gorulen = null; // ilk okumada mevcut islemler "gorulmus" sayilir, sonra gelen her yeni islem bip bip calar
async function islemleriOku() {
  try {
    const r = await fetch("islemler.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return;
    const d = await r.json();
    const liste = d.islemler || [];
    const anahtar = i => [i.coin, i.yon, i.alt, i.ust, i.stop, i.hedef].join("|");
    const yeniler = [];
    if (gorulen === null) { gorulen = new Set(liste.map(anahtar)); if (liste.some(i => new Date(i.bitis).getTime() > Date.now())) aktif.ttg = true; }
    else for (const i of liste) if (!gorulen.has(anahtar(i))) { gorulen.add(anahtar(i)); if (new Date(i.bitis).getTime() > Date.now()) yeniler.push(i); }
    const kalkan = ISLEMLER.filter(i => new Date(i.bitis).getTime() > Date.now() && !liste.some(y => anahtar(y) === anahtar(i)) && !liste.some(y => y.coin === i.coin));
    if (kalkan.length && gorulen) iptalUyari(kalkan, d.iptaller || []);
    if (JSON.stringify(liste) !== JSON.stringify(ISLEMLER)) { ISLEMLER = liste; ttgKart(); ttgGrafik(); listeKur(); }
    if (yeniler.length) yeniIslemUyari(yeniler);
  } catch (e) {}
}

// ---- muzik: tarayicida uretilen 124 BPM house / tekno dongusu (dosya yok, telifsiz). Alarm bipleri ustune biner. ----
const MZ = {acik: false, ctx: null, ana: null, adim: 0, sonraki: 0, zam: null, bpm: 124, gurultu: null};
function mzKur() {
  const c = MZ.ctx = new (window.AudioContext || window.webkitAudioContext)();
  const komp = c.createDynamicsCompressor(); komp.threshold.value = -14; komp.ratio.value = 4;
  MZ.ana = c.createGain(); MZ.ana.gain.value = 0.32; MZ.ana.connect(komp); komp.connect(c.destination);
  const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  MZ.gurultu = b;
}
function mzKick(t) {
  const c = MZ.ctx, o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(g); g.connect(MZ.ana); o.start(t); o.stop(t + 0.4);
}
function mzGurultu(t, sure, frek, tip, ses) {
  const c = MZ.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = MZ.gurultu; f.type = tip; f.frequency.value = frek;
  g.gain.setValueAtTime(ses, t); g.gain.exponentialRampToValueAtTime(0.001, t + sure);
  s.connect(f); f.connect(g); g.connect(MZ.ana); s.start(t); s.stop(t + sure + 0.02);
}
function mzNota(t, frek, sure, tip, ses, kesim) {
  const c = MZ.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = tip; o.frequency.value = frek; f.type = "lowpass"; f.Q.value = 8;
  f.frequency.setValueAtTime(kesim, t); f.frequency.exponentialRampToValueAtTime(kesim / 4, t + sure);
  g.gain.setValueAtTime(ses, t); g.gain.exponentialRampToValueAtTime(0.001, t + sure);
  o.connect(f); f.connect(g); g.connect(MZ.ana); o.start(t); o.stop(t + sure + 0.02);
}
const MZ_BAS = [55, 0, 55, 110, 0, 55, 0, 65.41, 55, 0, 55, 110, 0, 49, 0, 49];   // A1 kok, 16'lik
const MZ_AKOR = [[220, 261.63, 329.63], [196, 246.94, 293.66], [174.61, 220, 261.63], [196, 246.94, 329.63]];  // Am G F G
function mzAdim(i, t) {
  const bar = Math.floor(i / 16) % 4, s = i % 16, k = Math.floor(i / 64) % 8;
  if (s % 4 === 0) mzKick(t);
  if (s % 4 === 2) mzGurultu(t, 0.06, 8000, "highpass", 0.35);                     // acik hi-hat (offbeat)
  else if (k >= 1) mzGurultu(t, 0.02, 10000, "highpass", 0.08);                    // kapali hi-hat
  if (k >= 2 && (s === 4 || s === 12)) mzGurultu(t, 0.15, 1500, "bandpass", 0.6);  // clap
  if (k >= 1 && MZ_BAS[s]) mzNota(t, MZ_BAS[s] * (bar === 2 ? 0.89 : 1), 0.18, "sawtooth", 0.35, 900);
  if (k >= 2 && (s === 3 || s === 10)) {
    const kes = 900 + 700 * Math.sin(i / 40);
    for (const f of MZ_AKOR[bar]) mzNota(t, f, 0.22, "sawtooth", 0.07, kes + 600);
  }
}
function mzZamanla() {
  const ad = 60 / MZ.bpm / 4;
  while (MZ.sonraki < MZ.ctx.currentTime + 0.12) { mzAdim(MZ.adim, MZ.sonraki); MZ.adim++; MZ.sonraki += ad; }
}
function muzikDugme() {
  const b = document.getElementById("muzikBtn"); if (!b) return;
  b.textContent = MZ.acik ? "⏹ Müziği durdur" : "🎵 Müzik";
  b.classList.toggle("secili", MZ.acik);
}
function muzik() {
  try {
    if (!MZ.ctx) mzKur();
    MZ.acik = !MZ.acik;
    if (MZ.acik) {
      MZ.ctx.resume(); MZ.adim = 0; MZ.sonraki = MZ.ctx.currentTime + 0.05;
      MZ.ana.gain.setTargetAtTime(0.32, MZ.ctx.currentTime, 0.05);
      MZ.zam = setInterval(mzZamanla, 25);
    } else {
      clearInterval(MZ.zam); MZ.ana.gain.setTargetAtTime(0.0001, MZ.ctx.currentTime, 0.05);
      setTimeout(() => { if (!MZ.acik) MZ.ctx.suspend(); }, 300);
    }
  } catch (e) {}
  muzikDugme();
}

let tulListe = [];
// ---- Trend tulu (14.11): ATR bandli trend izi, yumusatilmis. Dususte egri fiyatin ustunde (pembe), yukseliste altinda (yesil);
// egriyle fiyat arasi tul gibi solan renkle dolar.
function tulBul() {
  const n = bars.length; if (n < 40) return [];
  const atr = rma(trHesap(), 14), orta = emaN(bars.map(b => (b.high + b.low) / 2), 10), out = [];
  let yon = 1, iz = null;
  for (let i = 0; i < n; i++) {
    if (atr[i] == null || orta[i] == null) { out.push(null); continue; }
    const c = bars[i].close, ust = orta[i] + 1.8 * atr[i], alt = orta[i] - 1.8 * atr[i];
    if (iz === null) iz = alt;
    if (yon === 1) { iz = Math.max(iz, alt); if (c < iz) { yon = -1; iz = ust; } }
    else { iz = Math.min(iz, ust); if (c > iz) { yon = 1; iz = alt; } }
    out.push({v: iz, yon});
  }
  const yum = emaN(out.map(o => o && o.v), 6);

}
let likListe = [], hpVeri = null, hpAnahtar = "";
// ---- Hacim profili (14.11): yuklu mumlarin hacmi fiyat kutularina dagitilir; yukselen mum = alim, dusen = satim. POC + %70 deger alani.
function hpBul() {
  // TradingView SVP gibi: her gun (UTC 00:00 = 03:00 TR) ayri profil, o gunun basinda cizilir. 4s ve ustu: gorunen aralik tek profil.
  const vr = chart.timeScale().getVisibleLogicalRange();
  const a0 = Math.max(0, Math.floor(vr ? vr.from : 0)), z0 = Math.min(bars.length - 1, Math.ceil(vr ? vr.to : bars.length - 1));
  if (aralik.sn >= 14400) { const h = hpHesap(bars.slice(a0, z0 + 1)); return h ? [{...h, i0: null}] : []; }
  const gun = t => Math.floor((t - TZ) / 86400), out = [];
  let i = a0; while (i > 0 && gun(bars[i - 1].time) === gun(bars[a0].time)) i--;
  while (i <= z0) {
    let j = i; while (j + 1 < bars.length && gun(bars[j + 1].time) === gun(bars[i].time)) j++;
    const h = hpHesap(bars.slice(i, j + 1));
    if (h) out.push({...h, i0: i, i1: j, son: j === bars.length - 1});
    i = j + 1;
  }

}
function hpHesap(bars) {
  if (bars.length < 4) return null;
  const B = 40, lo = Math.min(...bars.map(b => b.low)), hi = Math.max(...bars.map(b => b.high)), st = (hi - lo) / B || 1;
  const al = new Array(B).fill(0), sat = new Array(B).fill(0);
  for (const b of bars) {
    const a = Math.min(B - 1, Math.floor((b.low - lo) / st)), z = Math.min(B - 1, Math.floor((b.high - lo) / st)), pay = b.v / (z - a + 1);
    for (let j = a; j <= z; j++) (b.close >= b.open ? al : sat)[j] += pay;
  }
  const top = al.map((x, j) => x + sat[j]), poc = top.indexOf(Math.max(...top)), tum = top.reduce((x, y) => x + y, 0);
  let L = poc, H = poc, t = top[poc];
  while (t < tum * 0.7 && (L > 0 || H < B - 1)) { if ((L > 0 ? top[L - 1] : -1) >= (H < B - 1 ? top[H + 1] : -1)) t += top[--L]; else t += top[++H]; }

}
// ---- Likidasyon seviyeleri (Time to Go, 14.11): yuksek hacimli mumlarda acilan kaldiracli pozisyonlarin
// tahmini patlama fiyatlari. Fiyat seviyeye degince likidite alinmis sayilir ve silinir. Yakin seviyeler birlesir.
function likBul() {
  const n = bars.length; if (n < 30) return [];
  const vs = sma(bars.map(b => b.v), 20), KAL = [[10, 1], [25, 0.9], [50, 0.75], [100, 0.6]];
  let ac = [], biten = [];
  for (let i = 20; i < n; i++) {
    const b = bars[i];
    ac = ac.filter(l => { const dg = l.ust ? b.high >= l.p : b.low <= l.p; if (dg) { l.j = i; biten.push(l); } return !dg; });
    if (i === n - 1 || !vs[i - 1] || b.v < vs[i - 1] * 1.6) continue;
    const g = (b.high + b.low + b.close) / 3, k = b.v / vs[i - 1];
    for (const [x, w] of KAL) { ac.push({i, p: g * (1 + 1 / x), ust: true, w: k * w, x}); ac.push({i, p: g * (1 - 1 / x), ust: false, w: k * w, x}); }
  }
  // 14.11 (uye onerisi): tek tek nokta yerine toplu goster -> yakin seviyeler fiyat bantlarina toplanir,
  // bandin yogunlugu = icindeki seviyelerin agirlik toplami. Her yonde en yogun 4 acik bant + son 200 mumda alinan 3 bant.
  const son = bars[n - 1].close, ADIM = son * 0.003, AZAMI = son * 0.012;
  const kumele = (liste, ust) => {
    const s = liste.slice().sort((a, b) => a.p - b.p), out = [];
    for (const l of s) {
      const k = out[out.length - 1];
      if (k && l.p - k.son <= ADIM && l.p - k.lo <= AZAMI) { k.son = l.p; k.hi = l.p; k.w += l.w; k.say++; k.i = Math.min(k.i, l.i); k.j = l.j == null || k.j == null ? null : Math.max(k.j, l.j); }
      else out.push({lo: l.p, hi: l.p, son: l.p, w: l.w, say: 1, i: l.i, j: l.j ?? null, ust});
    }
    return out;
  };
  const ab = kumele(ac.filter(l => l.ust), true).concat(kumele(ac.filter(l => !l.ust), false));
  const acik = ["u", "a"].flatMap(y => ab.filter(b => b.ust === (y === "u")).sort((a, b) => b.w - a.w).slice(0, 4));
  const eski = kumele(biten.filter(l => l.j > n - 200 && l.ust), true).concat(kumele(biten.filter(l => l.j > n - 200 && !l.ust), false))
    .sort((a, b) => b.w - a.w).slice(0, 3);
  const hep = acik.concat(eski), mx = Math.max(1, ...hep.map(b => b.w));
  return hep.map(b => {

    return {...b, lo: m - yar, hi: m + yar, o: Math.min(1, b.w / mx)};

}
function sistemCiz(W, H) {

          `<polygon points="${ust} ${fiy}" fill="url(#${gid})"/><polyline points="${ust}" fill="none" stroke="rgba(${r},.95)" stroke-width="1.6"/>`;

      if (t.yon !== yon) { bit(); yon = t.yon; }
